<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#123d2d" />
    <title>InvestFund — Offline</title>
    <style>
      body {
        margin: 0;
        background: #f4f6f2;
        color: #10251c;
        font: 16px system-ui;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 32px;
        border-radius: 32px;
        background: #fff;
        box-shadow: 0 20px 60px #123d2d18;
      }
      .logo {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        background: #123d2d;
        color: #d9ff71;
        font-weight: 900;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 32px;
      }
      p {
        color: #557065;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 14px;
        background: #123d2d;
        color: #fff;
        padding: 14px 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">I</div>
      <h1>You’re offline</h1>
      <p>
        Reconnect before viewing balances or making any financial request.
        InvestFund never performs deposits, investments or withdrawals offline.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
